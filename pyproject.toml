[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendfollowing"
version = "1.0.5"
description = "trendfollowing — closed-form trend-following analytics, reference system implementations, and reproducible futures evidence in Python for quantitative researchers and practitioners."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
    {name = "Vladimir Lucic"},
]
keywords = [
    "trend-following",
    "momentum",
    "time-series-momentum",
    "tsmom",
    "cta",
    "managed-futures",
    "sharpe-ratio",
    "autocorrelation",
    "arfima",
    "long-memory",
    "ewma-filter",
    "backtesting",
    "futures",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "numba>=0.59",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "qis>=5.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "sphinx-sitemap>=2.9",
]

[project.urls]
Homepage = "https://github.com/ArturSepp/TrendFollowingSystems"
Documentation = "https://github.com/ArturSepp/TrendFollowingSystems#readme"
Repository = "https://github.com/ArturSepp/TrendFollowingSystems"
Issues = "https://github.com/ArturSepp/TrendFollowingSystems/issues"
Changelog = "https://github.com/ArturSepp/TrendFollowingSystems/blob/main/CHANGELOG.md"
Paper = "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3167787"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["trendfollowing*"]

[tool.setuptools.package-data]
trendfollowing = ["settings.yaml", "resources/futures/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
# The repo root is on sys.path only so tests can import the non-installed papers.*
# replication modules. tests/test_src_layout.py prevents this exception from masking
# a legacy root trendfollowing/ package.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# "I" is not selected anywhere in this stack: the import convention groups the scientific
# stack before the project packages, which isort reorders.
select = ["E", "F", "W"]

[tool.coverage.run]
source = ["src/trendfollowing"]

[tool.coverage.report]
show_missing = true
