name: External documentation health
on:
  push:
    branches: [main]
    paths:
      - docs/quickstart.md
      - tools/check_deployed_docs.py
      - tests/test_deployed_docs_checker.py
      - .github/workflows/link-health.yml
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quickstarts:
    name: Published TFS quickstarts (latest and stable)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - name: Reject stale published quickstart instructions
        run: python tools/check_deployed_docs.py --quickstarts
  links:
    if: github.event_name != 'push'
    uses: ./.github/workflows/docs.yml
    with:
      online: true
    permissions:
      contents: read
      pages: write
      id-token: write
